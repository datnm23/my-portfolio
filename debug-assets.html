<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Assets</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .success { color: green; }
        .error { color: red; }
        button { margin: 5px; padding: 10px 15px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Debug Assets Test</h1>
    
    <div class="test-section">
        <h2>CV File Test</h2>
        <button onclick="testCV()">Test CV Download</button>
        <button onclick="openCV()">Open CV Direct</button>
        <div id="cv-result"></div>
    </div>
    
    <div class="test-section">
        <h2>Google Drive Test</h2>
        <button onclick="testGoogleDrive('12t4NrjGm6abNYFGiK781KpZanb1c-mje')">Test Google Drive 1</button>
        <button onclick="testGoogleDrive('1IvL2eIc9e9bFK6tbFyiDCrehuaIyMqe5')">Test Google Drive 2</button>
        <button onclick="testGoogleDrive('1XPFwum3FlJ7D8KYYi5RU5i_h7LZa3ulw')">Test Google Drive 3</button>
        <div id="drive-result"></div>
    </div>
    
    <div class="test-section">
        <h2>Excel Files Test</h2>
        <button onclick="testExcelFile('2025.08.11Thanhtoandot2-HD21.2025.CT01.SM-HL.xlsx')">Test Excel 1</button>
        <button onclick="testExcelFile('250717BOQFULLSỬA-OPB(ORIGINAL)R4-KCT-Gửi.xlsx')">Test Excel 2</button>
        <button onclick="testExcelFile('NET-HVC-BOQ-GoithauMEP21T2-L1-23-10-2025.xlsx')">Test Excel 3</button>
        <div id="excel-result"></div>
    </div>

    <script>
        function log(elementId, message, isError = false) {
            const element = document.getElementById(elementId);
            const p = document.createElement('p');
            p.className = isError ? 'error' : 'success';
            p.textContent = new Date().toLocaleTimeString() + ' - ' + message;
            element.appendChild(p);
        }

        function testCV() {
            const cvPath = '/CV_Nguyen_Manh_Dat.pdf';
            
            fetch(cvPath)
                .then(response => {
                    if (response.ok) {
                        log('cv-result', `CV file accessible: ${response.status} ${response.statusText}`);
                        log('cv-result', `File size: ${response.headers.get('content-length')} bytes`);
                    } else {
                        log('cv-result', `CV file not accessible: ${response.status} ${response.statusText}`, true);
                    }
                })
                .catch(error => {
                    log('cv-result', `Error accessing CV: ${error.message}`, true);
                });
        }

        function openCV() {
            window.open('/CV_Nguyen_Manh_Dat.pdf', '_blank');
        }

        function testGoogleDrive(driveId) {
            const urls = [
                `https://docs.google.com/spreadsheets/d/${driveId}/edit?usp=sharing`,
                `https://drive.google.com/file/d/${driveId}/view?usp=sharing`,
                `https://docs.google.com/viewer?url=https://drive.google.com/uc?id=${driveId}`
            ];
            
            log('drive-result', `Testing Google Drive ID: ${driveId}`);
            
            urls.forEach((url, index) => {
                const link = document.createElement('a');
                link.href = url;
                link.target = '_blank';
                link.textContent = `Open URL ${index + 1}`;
                link.style.display = 'block';
                link.style.margin = '5px 0';
                document.getElementById('drive-result').appendChild(link);
            });
        }

        function testExcelFile(fileName) {
            const filePath = `/${fileName}`;
            
            fetch(filePath)
                .then(response => {
                    if (response.ok) {
                        log('excel-result', `Excel file accessible: ${fileName} - ${response.status}`);
                        
                        // Try to download
                        const link = document.createElement('a');
                        link.href = filePath;
                        link.download = fileName;
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                        
                        log('excel-result', `Download initiated for: ${fileName}`);
                    } else {
                        log('excel-result', `Excel file not accessible: ${fileName} - ${response.status}`, true);
                    }
                })
                .catch(error => {
                    log('excel-result', `Error accessing Excel file ${fileName}: ${error.message}`, true);
                });
        }
    </script>
</body>
</html>
